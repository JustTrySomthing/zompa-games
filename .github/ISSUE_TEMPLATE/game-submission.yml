name: Submit or update a game
description: Send a Zompa game and required catalog artwork for review.
title: "[Game submission] "
body:
  - type: input
    id: game
    attributes:
      label: Game title and version
      description: Include the existing catalog game ID for an update.
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Game files
      description: Link to the source, the .zomp build, and the license. For updates, summarize the changes.
    validations:
      required: true
  - type: checkboxes
    id: modes
    attributes:
      label: Supported modes
      options:
        - label: Single Player
          required: true
        - label: Pass & Play
          required: true
        - label: Online with a friend
          required: true
  - type: checkboxes
    id: help
    attributes:
      label: How to play
      options:
        - label: My package has how-to-play.txt at its root, with a short explanation of the goal, what to do, and how to win.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Game description
      description: Write one short paragraph of up to 600 characters about what players do and what makes the game interesting.
    validations:
      required: true
  - type: textarea
    id: artwork
    attributes:
      label: Cover and gameplay screenshots
      description: Link one 1280 × 720 cover and three to eight gameplay screenshots at their natural aspect ratio, with a caption for each. Use still WebP images up to 350 KiB each.
    validations:
      required: true
