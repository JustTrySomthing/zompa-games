name: Publish official game

on:
  pull_request:
    paths:
      - '.github/release-request.json'
      - '.github/workflows/publish-game.yml'
      - 'tools/package_game.py'
      - 'drop-four/**'
  workflow_dispatch:
    inputs:
      candidate:
        description: Reference version to verify without publishing
        required: false
        type: string
  push:
    branches: [main]
    paths: [".github/release-request.json"]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-drop-four-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    outputs:
      recovered: ${{ steps.recover.outputs.verified }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the reference candidate
        env:
          CANDIDATE: ${{ inputs.candidate || (github.event_name == 'pull_request' && '1.3.14') || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$CANDIDATE" ]]; then
            python3 tools/package_game.py out "$CANDIDATE"
          else
            python3 tools/package_game.py out
          fi
      - name: Verify a previous Android result for publication recovery
        id: recover
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=$(jq -r '.verifiedRun // empty' .github/release-request.json)
          [[ -n "$verified" ]] || exit 0
          [[ "$verified" =~ ^[1-9][0-9]*$ && "$verified" != "$GITHUB_RUN_ID" ]]
          run="repos/$GITHUB_REPOSITORY/actions/runs/$verified"
          gh api "$run" | jq -e '
            .status == "completed" and .event == "push" and .head_branch == "main"
            and .path == ".github/workflows/publish-game.yml"
          ' > /dev/null
          gh api "$run/jobs?filter=latest" | jq -e '
            any(.jobs[]; .name == "android / friends" and .conclusion == "success")
          ' > /dev/null
          gh run download "$verified" -R "$GITHUB_REPOSITORY" \
            --name cats-vs-dogs-candidate --dir "$RUNNER_TEMP/tested-game"
          filename=$(jq -er '.games[0].url | split("/") | last' out/catalog-v2.json)
          [[ "$filename" =~ ^[A-Za-z0-9.-]+\.zomp$ ]]
          cmp "out/$filename" "$RUNNER_TEMP/tested-game/$filename"
          cmp out/catalog-v2.json "$RUNNER_TEMP/tested-game/catalog-v2.json"
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cats-vs-dogs-candidate
          path: out
          if-no-files-found: error
  android:
    needs: package
    if: needs.package.outputs.recovered != 'true'
    uses: JustTrySomthing/zompa/.github/workflows/android-friends-smoke.yml@9cfffb7dbd00e5021112f3724a44187f660cab36
    with:
      app-ref: 9cfffb7dbd00e5021112f3724a44187f660cab36
      game-artifact: cats-vs-dogs-candidate
  publish:
    needs: [package, android]
    permissions:
      contents: write
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'JustTrySomthing/zompa-games' &&
      needs.package.result == 'success' &&
      (needs.android.result == 'success' || needs.package.outputs.recovered == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cats-vs-dogs-candidate
          path: out
      - name: Publish .zomp and refresh the current catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r '.games[0].version' out/catalog-v2.json)
          build=$(jq -r '.games[] | select(.id=="drop-four") | .build' out/catalog-v2.json)
          tag="drop-four-v$version"
          title=$(jq -er '.games[0].title' out/catalog-v2.json)
          url=$(jq -er '.games[0].url' out/catalog-v2.json)
          filename=${url##*/}
          [[ "$filename" =~ ^[a-zA-Z0-9.-]+\.zomp$ ]]
          package="out/$filename"
          required=$(jq -er '.games[0].minZompaBuild // 1' out/catalog-v2.json)
          shipped=$(curl -fsSL https://raw.githubusercontent.com/JustTrySomthing/zompa/main/update.json | jq -er '.build')
          [[ "$shipped" -ge "$required" ]] || {
            echo "Publish a compatible Zompa Android release before listing this game." >&2
            exit 1
          }
          hash=$(jq -er '.games[0].sha256' out/catalog-v2.json)
          [[ "$hash" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$hash" "$package" | sha256sum --check
          endpoint="repos/$GITHUB_REPOSITORY/contents/catalog-v2.json"
          if gh api "$endpoint?ref=main" > out/previous.json 2>out/feed-error; then
            old=$(jq -r .content out/previous.json | base64 --decode | jq -r '.games[] | select(.id=="drop-four") | .build')
            [[ "$build" -gt "$old" ]]
            sha=$(jq -r .sha out/previous.json)
            jq -r .content out/previous.json | base64 --decode > out/old-catalog.json
            jq --slurpfile old out/old-catalog.json \
              '.archive = ((($old[0].archive // []) + [$old[0].games[] | select(.id=="drop-four")]) | unique_by([.id, .build])) | .games += [$old[0].games[] | select(.id!="drop-four")]' \
              out/catalog-v2.json > out/next-catalog.json
            mv out/next-catalog.json out/catalog-v2.json
          else
            grep -q 'HTTP 404' out/feed-error || { cat out/feed-error >&2; exit 1; }
            sha=''
          fi

          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets > out/release.json; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$title $version for Zompa" \
              --notes "Official .zomp package for the Zompa catalog."
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets > out/release.json
          fi
          if [[ $(jq -r .isDraft out/release.json) == true ]]; then
            [[ $(jq -r .targetCommitish out/release.json) == "$GITHUB_SHA" ]]
            # Replace an interrupted upload in this draft only.
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$package" --clobber
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          curl -fsSL --retry 5 --retry-all-errors "$url" -o out/public.zomp
          cmp "$package" out/public.zomp
          jq -n --arg data "$(base64 -w 0 out/catalog-v2.json)" --arg sha "$sha" \
            '{message:"Update official .zomp game catalog", content:$data, branch:"main"} + if $sha == "" then {} else {sha:$sha} end' |
            gh api --method PUT "$endpoint" --input - --jq .commit.sha
