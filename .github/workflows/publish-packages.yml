name: Publish game packages
on:
  push:
    branches: [main]
    paths: ['*/packages/*.zomp', '.github/workflows/publish-packages.yml', 'tools/publish_packages.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-packages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify releases and update Get Games
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_packages.py
